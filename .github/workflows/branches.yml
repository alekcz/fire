name: branches

on:
  push:
    # a lone negative pattern matches nothing, so the previous ['!master']
    # meant this workflow never ran at all. branches-ignore is the form that
    # actually excludes master while matching everything else.
    branches-ignore: [master]

# Offline only, deliberately. The live tier and both native image builds run
# in the master workflow, which fires on every pull request against master —
# so anything heading there is covered. Running them here too meant the live
# suite ran TWICE per push, and since both workflows share the
# `fire-live-tests` concurrency group they could not overlap: the wall clock
# was additive, and the queued one was cancelled, which reads like a failure
# rather than contention. A branch with no pull request open still gets the
# ten-job matrix below, which spans every jdk and clojure fire supports.
jobs:
  offline:
    name: Offline tests (java ${{ matrix.java }}, clojure ${{ matrix.clojure }})
    runs-on: ubuntu-latest
    # the same matrix as the master workflow, because this is the one that runs
    # on a branch and on a PR against anything but master — and a source-only
    # library runs on whatever jdk and clojure the consumer brings
    strategy:
      fail-fast: false
      matrix:
        # 8 is the floor, and it is on the list so that it stays one
        java: ['8', '11', '17', '21', '25']
        clojure: ['1.11', '1.12']
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ matrix.java }}

    - name: Install Leiningen
      run: |
        curl -sLo lein https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein
        chmod +x lein
        sudo mv lein /usr/local/bin/lein
        lein version

    - name: Cache deps
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('project.clj') }}
        restore-keys: |
              ${{ runner.os }}-maven-

    # no secrets, no emulator, no network: everything that can be checked
    # without real firebase credentials, so a fork or a branch pushed before
    # secrets exist still gets a signal.
    - name: Run offline tests
      run: lein with-profile +clj-${{ matrix.clojure }} test :offline
