name: branches

on:
  push:
    # a lone negative pattern matches nothing, so the previous ['!master']
    # meant this workflow never ran at all. branches-ignore is the form that
    # actually excludes master while matching everything else.
    branches-ignore: [master]

jobs:
  offline:
    name: Offline tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '11'

    - name: Install Leiningen
      run: |
        curl -sLo lein https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein
        chmod +x lein
        sudo mv lein /usr/local/bin/lein
        lein version

    - name: Cache deps
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('project.clj') }}
        restore-keys: |
              ${{ runner.os }}-maven-

    # no secrets, no emulator, no network: everything that can be checked
    # without real firebase credentials, so a fork or a branch pushed before
    # secrets exist still gets a signal.
    - name: Run offline tests
      run: lein test :offline

  full:
    name: Full test suite
    needs: offline
    runs-on: ubuntu-latest
    # the live tests all share one firebase project, so only one of these may
    # run at a time across the whole repo. a PR fires this workflow and the
    # master one on the same commit, and two runs writing the same database
    # paths and claiming the same phone numbers corrupt each other's results.
    concurrency:
      group: fire-live-tests
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '11'

    - name: Install Leiningen
      run: |
        curl -sLo lein https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein
        chmod +x lein
        sudo mv lein /usr/local/bin/lein
        lein version

    - name: Cache deps
      uses: actions/cache@v4
      id: cache-deps
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('project.clj') }}
        restore-keys: |
              ${{ runner.os }}-maven-

    - name: Cache emulator
      uses: actions/cache@v4
      id: cache-deps-fb
      with:
        path: ~/.cache/firebase/emulators
        key: ${{ runner.os }}-fb-${{ hashFiles('firebase.json') }}
        restore-keys: |
              ${{ runner.os }}-fb-

    - name: Run tests
      env: 
        FIRE: ${{ secrets.FIRE }}
        VISION_API: ${{ secrets.VISION_API }}
        FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        NPM_CONFIG_PREFIX: ~/.npm-global
        FIREBASE_DATABASE_EMULATOR_HOST: 127.0.0.1:9000
      run: |
        mkdir -p ~/.npm-global
        npm config set prefix '~/.npm-global'
        export PATH=~/.npm-global/bin:$PATH
        source ~/.profile
        npm install -g firebase-tools@8.5.0
        bash ./ci.sh

    # keep the line-by-line report, so a coverage regression can be read
    # rather than guessed at
    - name: Archive coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: target/coverage
        retention-days: 7

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./target/coverage/codecov.json
        fail_ci_if_error: false
